# home-mcp production deployment.
#
# Mirrors the shorts stack: jwilder/nginx-proxy + acme/letsencrypt-companion
# (already running on this host) route the vhost to this container over the
# shared external `proxy_default` network. The container publishes NO host
# ports — only the proxy can reach it — and the bearer token is always enforced
# by the app, so it's never exposed to the public.
#
# The image is built and pushed to GHCR by .github/workflows/deploy.yml; the
# server just pulls it (it's already `docker login ghcr.io`'d). Routine deploy:
#   docker compose pull && docker compose up -d --remove-orphans
#
# .env (rendered by CI from repo secrets) provides HOME_MCP_TOKEN, HOME_MCP_DOMAIN,
# LETSENCRYPT_EMAIL, HOME_MCP_IMAGE, and any optional settings.

name: home-mcp

services:
  home-mcp:
    image: ${HOME_MCP_IMAGE:-ghcr.io/lisibachramon/home-mcp:latest}
    container_name: home-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      HOME_MCP_HOST: "0.0.0.0"          # reachable by nginx-proxy on proxy_default
      HOME_MCP_SELF_CONTAINER: "home-mcp"
      HOME_MCP_TRUST_PROXY: "true"
      # nginx-proxy routing + letsencrypt-companion certificate
      VIRTUAL_HOST: ${HOME_MCP_DOMAIN}
      VIRTUAL_PORT: "8848"
      LETSENCRYPT_HOST: ${HOME_MCP_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock          # control the host's Docker
      - ${STACKS_DIR:-/srv/stacks}:${STACKS_DIR:-/srv/stacks}:rw  # compose projects to deploy
      # Optional: reuse the host's gh login instead of GH_TOKEN in .env
      # - ${HOME}/.config/gh:/root/.config/gh:ro
    networks:
      - proxy_default

networks:
  # The network the running nginx-proxy/letsencrypt-companion stack lives on.
  proxy_default:
    external: true
