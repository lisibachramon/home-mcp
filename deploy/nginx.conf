# nginx reverse proxy for home-mcp (alternative to Caddy).
# Terminate TLS here (e.g. with certbot-managed certs) and proxy to the app.
# Replace home-mcp.example.com and the cert paths.

server {
    listen 443 ssl http2;
    server_name home-mcp.example.com;

    ssl_certificate     /etc/letsencrypt/live/home-mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/home-mcp.example.com/privkey.pem;

    # The app enforces the bearer token; optionally also restrict by source IP:
    # allow 100.64.0.0/10;   # Tailscale
    # allow 192.168.0.0/16;  # LAN
    # deny all;

    location / {
        proxy_pass http://127.0.0.1:8848;   # or http://home-mcp:8848 on a shared network
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP / SSE needs unbuffered, long-lived responses.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name home-mcp.example.com;
    return 301 https://$host$request_uri;
}
